<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — Карта сети</title>
<style>body{margin:0;background:#f2f2f7;color:#111;font:16px system-ui;min-height:100vh;display:grid;place-items:center}form{background:white;border-radius:18px;padding:28px;width:min(340px,80vw)}h1{font-size:24px}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border-radius:9px;border:1px solid #bbb}input{margin-top:6px}button{background:#007aff;color:white;border:0}#error{color:#a32018;min-height:24px}</style></head>
<body><form><h1>Карта сети</h1><p>Совместная работа</p><label>Логин<input name="login" autocomplete="username" required maxlength="40"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><p id="error" role="alert"></p><button>Войти</button></form>
<script>document.querySelector('form').onsubmit=async function(e){e.preventDefault();var b=this.querySelector('button');b.disabled=true;try{var r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(this)))});var d=await r.json();if(!r.ok)throw Error(d.error);location.replace('/');}catch(e){document.querySelector('#error').textContent=e.message;b.disabled=false;}};</script></body></html>
