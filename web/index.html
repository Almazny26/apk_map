<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17324D">
<title>Карта сети</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css?v=1.2">
<link rel="stylesheet" href="app.css?v=1.2">
</head>
<body class="booting">

<div id="map"></div>

<div id="cross" hidden aria-hidden="true"><svg viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="11" fill="none" stroke="#fff" stroke-width="5"/>
  <circle cx="32" cy="32" r="11" fill="none" stroke="#0b6bcb" stroke-width="2.5"/>
  <path d="M32 4v17M32 43v17M4 32h17M43 32h17" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <path d="M32 4v17M32 43v17M4 32h17M43 32h17" stroke="#0b6bcb" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="2" style="fill:#0b6bcb"/>
</svg></div>

<header id="top">
  <button class="ib" id="btnMenu" data-act="menu" aria-label="Меню">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <input id="search" type="search" placeholder="Найти узел" autocomplete="off" enterkeyhint="search" aria-label="Поиск узла">
  <button id="sync" data-act="sync" aria-label="Состояние связи"><i></i><span id="synctext"></span></button>
</header>

<div id="mapbtns">
  <button class="ib" id="btnNorth" data-act="north" hidden aria-label="Повернуть карту севером вверх">
    <svg viewBox="0 0 24 24" id="needle"><path class="north" d="M12 2.5 16.5 12h-9Z"/><path class="south" d="M12 21.5 7.5 12h9Z"/></svg>
  </button>
  <button class="ib" data-act="layer" aria-label="Схема или спутник">
    <svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg>
  </button>
  <button class="ib" id="btnLocate" data-act="locate" aria-label="Моё местоположение">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="1.6" class="fill"/></svg>
  </button>
  <button class="ib" data-act="fit" aria-label="Показать всю сеть">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</div>

<div id="fabmenu" hidden>
  <button data-act="add-link"><svg viewBox="0 0 24 24"><path d="M6 18 18 6"/><circle cx="5" cy="19" r="2.5" class="fill"/><circle cx="19" cy="5" r="2.5" class="fill"/></svg>Линия между узлами</button>
  <button data-act="add-node"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" class="fill"/></svg>Узел</button>
</div>
<button id="fab" data-act="fab" hidden aria-label="Добавить">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div id="modebar" hidden>
  <div id="modetext"></div>
  <div id="modebtns"></div>
</div>

<aside id="sheet" hidden>
  <div id="grab" aria-hidden="true"></div>
  <div id="sheethead">
    <button class="ib flat" id="sheetback" data-act="back" aria-label="Назад" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2 id="sheettitle"></h2>
    <button class="ib flat" data-act="close" aria-label="Закрыть">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div id="sheetbody"></div>
</aside>

<div id="scrim" data-act="menu-close" hidden></div>
<nav id="drawer" hidden>
  <div id="drawerhead">
    <div id="drawertitle">Карта сети</div>
    <div id="drawersub"></div>
  </div>
  <button data-act="show" data-view="list">Узлы и линии</button>
  <button data-act="show" data-view="filters">Условные обозначения и фильтр</button>
  <button data-act="show" data-view="journal">Журнал изменений</button>
  <button data-act="show" data-view="offline" class="native-only">Карта без интернета</button>
  <button data-act="show" data-view="users" class="admin-only">Пользователи</button>
  <button data-act="show" data-view="types" class="admin-only">Виды узлов, линий и состояния</button>
  <button data-act="show" data-view="exchange" class="web-only editor-only">Импорт и экспорт</button>
  <button data-act="show" data-view="settings">Настройки и учётная запись</button>
</nav>

<section id="login" hidden>
  <form id="loginform" autocomplete="on">
    <svg class="logo" viewBox="0 0 108 108"><rect width="108" height="108" rx="24" fill="#17324D"/><path d="M36 68 54 38l20 24Z" fill="none" stroke="#7FD1FF" stroke-width="3.5" stroke-linejoin="round"/><circle cx="54" cy="38" r="8" fill="#fff"/><circle cx="36" cy="68" r="7" fill="#fff"/><circle cx="74" cy="62" r="7" fill="#FFB23E"/></svg>
    <h1>Карта сети</h1>
    <label id="serverrow">Адрес сервера
      <input id="lgServer" type="url" inputmode="url" placeholder="http://адрес:8790" autocapitalize="off" autocomplete="off" spellcheck="false">
    </label>
    <label>Логин
      <input id="lgLogin" type="text" autocapitalize="off" autocomplete="username" spellcheck="false" required>
    </label>
    <label>Пароль
      <input id="lgPass" type="password" autocomplete="current-password" required>
    </label>
    <div id="lgError" class="error" hidden></div>
    <button type="submit" class="btn primary" id="lgBtn">Войти</button>
    <a id="lgApk" class="apk" hidden>Скачать приложение для Android</a>
    <div class="ver" id="lgVer"></div>
  </form>
</section>

<div id="hint" hidden>Карта пока пустая. Нажмите <b>+</b>, чтобы поставить первый узел.</div>

<div id="dialog" hidden>
  <div id="dialogbox" role="alertdialog" aria-modal="true" aria-labelledby="dialogtext">
    <p id="dialogtext"></p>
    <div class="actions">
      <button class="btn" data-act="dialog-cancel">Отмена</button>
      <button class="btn primary" id="dialogok" data-act="dialog-ok">Да</button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>

<script src="vendor/maplibre/maplibre-gl.js?v=1.2"></script>
<script src="js/core.js?v=1.2"></script>
<script src="js/mapview.js?v=1.2"></script>
<script src="js/ui.js?v=1.2"></script>
</body>
</html>
