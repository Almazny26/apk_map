name: Сборка APK

# Собирает Android-приложение и кладёт готовый файл в apk/karta-seti.apk.
# Запускается сам, когда меняется клиент (web/) или оболочка (android/).

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Подготовить ключ подписи
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/netmap.keystore
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Секрет KEYSTORE_B64 не задан: сборка только проверочная, APK не публикуется"
            keytool -genkeypair -keystore android/netmap.keystore -storetype PKCS12 -alias netmap -keyalg RSA \
              -keysize 2048 -validity 30 -storepass netmap-internal -keypass netmap-internal -dname "CN=test"
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -Pvc=${{ github.run_number }} -Pvn=2.0.${{ github.run_number }}

      - name: Проверить подпись
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Положить APK в репозиторий
        if: steps.key.outputs.real == 'true'
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/karta-seti.apk
          cat > apk/version.json <<EOF
          {"versionCode": ${{ github.run_number }}, "versionName": "2.0.${{ github.run_number }}", "commit": "${{ github.sha }}", "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk
          git commit -m "APK 2.0.${{ github.run_number }} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: karta-seti-apk
          path: android/app/build/outputs/apk/release/app-release.apk
