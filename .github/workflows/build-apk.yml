name: Сборка APK

# Собирает Android-приложение и кладёт готовый файл в apk/karta-seti.apk.
# Запускается сам, когда меняется клиент (web/) или оболочка (android/).

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -Pvc=${{ github.run_number }} -Pvn=1.0.${{ github.run_number }}

      - name: Проверить подпись
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Положить APK в репозиторий
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/karta-seti.apk
          cat > apk/version.json <<EOF
          {"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}", "commit": "${{ github.sha }}", "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk
          git commit -m "APK 1.0.${{ github.run_number }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: karta-seti-apk
          path: apk/karta-seti.apk
