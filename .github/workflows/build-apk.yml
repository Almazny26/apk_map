name: Сборка APK

# Собирает Android-приложение со вшитой офлайн-схемой и выкладывает подписанный APK в релиз
# репозитория (APK со схемой ~165 МБ — больше лимита GitHub 100 МБ на файл в git).
# В git попадает только apk/version.json со ссылкой на релиз. Запуск — вручную (Actions → Run workflow).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Номер версии
        # код больше прежних 2.0.N (37…), поэтому 3.5 ставится поверх старого приложения
        run: |
          echo "VC=$((350000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VN=3.5.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Скачать офлайн-схему и проверить SHA-256
        run: |
          url=$(sed -n 's/^url=//p' android/offline-map.properties)
          sha=$(sed -n 's/^sha256=//p' android/offline-map.properties)
          size=$(sed -n 's/^size=//p' android/offline-map.properties)
          mkdir -p "$RUNNER_TEMP/map"
          curl -fL --retry 4 --retry-delay 5 -o "$RUNNER_TEMP/map/karta-offline.pmtiles" "$url"
          got=$(stat -c %s "$RUNNER_TEMP/map/karta-offline.pmtiles")
          [ "$got" = "$size" ] || { echo "::error::Размер схемы $got, ожидалось $size ($url)"; exit 1; }
          echo "$sha  $RUNNER_TEMP/map/karta-offline.pmtiles" | sha256sum -c - || { echo "::error::SHA-256 схемы не совпал ($url)"; exit 1; }

      - name: Подготовить ключ подписи
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/netmap.keystore
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Секрет KEYSTORE_B64 не задан: сборка только проверочная, APK не публикуется"
            keytool -genkeypair -keystore android/netmap.keystore -storetype PKCS12 -alias netmap -keyalg RSA \
              -keysize 2048 -validity 30 -storepass netmap-internal -keypass netmap-internal -dname "CN=test"
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -Pvc=$VC -Pvn=$VN -PrequireMap -PmapFile="$RUNNER_TEMP/map/karta-offline.pmtiles"

      - name: Проверить подпись и карту внутри
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          # карта должна лежать без сжатия (читается по смещению)
          unzip -v "$APK" assets/maps/karta-offline.pmtiles | grep -q " Stored " || { echo "::error::карта в APK сжата"; exit 1; }

      - name: Выложить APK в релиз
        if: steps.key.outputs.real == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" karta-seti.apk
          SHA=$(sha256sum karta-seti.apk | cut -d' ' -f1)
          TAG="apk-$VN"
          gh release create "$TAG" karta-seti.apk --target "${{ github.sha }}" --title "Приложение $VN" \
            --notes "Карта сети $VN для Android (со вшитой офлайн-схемой левого берега). SHA-256: $SHA"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/karta-seti.apk"
          mkdir -p apk
          cat > apk/version.json <<JSON
          {"versionCode": $VC, "versionName": "$VN", "commit": "${{ github.sha }}", "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)", "url": "$URL", "sha256": "$SHA", "size": $(stat -c %s karta-seti.apk)}
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch apk/karta-seti.apk     # APK теперь только в релизах
          git add apk/version.json
          git commit -m "APK $VN [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: karta-seti-apk
          path: android/app/build/outputs/apk/release/app-release.apk
